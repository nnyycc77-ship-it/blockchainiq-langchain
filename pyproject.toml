[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blockchainiq-langchain"
version = "0.1.0"
description = "LangChain tool for the Blockchain IQ crypto market brief, using the x402 protocol on Base"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=0.3",
    "x402[evm,requests]>=2.0",
    "requests>=2.31",
    "eth-account>=0.13",
]

[tool.setuptools.packages.find]
where = ["src"]
